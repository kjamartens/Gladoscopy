name: glados-pycromanager
display_name: Glados-PycroManager
contributions:
  commands:
    - id: glados-pycromanager.mainWidgetCall
      title: Run Glados-PycroManager
      python_name: glados_pycromanager._dock_widget:MainWidget
    - id: glados-pycromanager.UserManual
      title: Open the Glados user manual
      python_name: glados_pycromanager.GUI.GUI_napari:show_UserManualNapari
    - id: glados-pycromanager.performanceModeWidgetCall
      title: Open Performance Mode
      python_name: glados_pycromanager._dock_widget:PerformanceModeWidget
  widgets:
    - command: glados-pycromanager.mainWidgetCall
      display_name: Run Glados-PycroManager
    - command: glados-pycromanager.UserManual
      display_name: User Manual
    - command: glados-pycromanager.performanceModeWidgetCall
      display_name: Performance Mode
