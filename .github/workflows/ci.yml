name: CI

on:
  push:
    branches: [main, Code-cleanup, claude_optimization]
  pull_request:
    branches: [main, Code-cleanup]
  workflow_dispatch:

# Pin to a single runner / Python so failures point at code, not matrix
# noise. Glados-PycroManager is Windows-first (CLAUDE.md) and Python 3.13
# is the required interpreter (`pyproject.toml requires-python`).
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff + mypy only
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6" "mypy>=1.10"
      # Informational only at this gate — the codebase carries ~1000
      # pre-existing ruff findings (bare-except, unused-variable, etc.)
      # that Phase 9/10/11 progressively clean up. `--exit-zero` keeps the
      # job green while still printing the violations in the build log.
      - name: ruff check (informational)
        run: python -m ruff check glados_pycromanager tests --exit-zero
      - name: mypy (informational)
        continue-on-error: true
        run: python -m mypy glados_pycromanager

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
