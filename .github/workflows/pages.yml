name: Pages

# Documentation site (MkDocs Material, built from docs/ and mkdocs.yml) on GitHub Pages.
# The API reference is generated by mkdocstrings from the source by static analysis, so the
# package and its heavy dependencies are not installed here.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'glados_pycromanager/**', 'CONTRIBUTING.md', 'CHANGELOG.md', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "mkdocs<2" mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
